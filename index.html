<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desktop Dummy v1.0 - Web Controller</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #58a6ff;
            --border: #30363d;
            --text: #f0f6fc;
            --subtext: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        p.status {
            font-size: 0.85rem;
            color: var(--subtext);
            margin-top: 4px;
        }

        .ip-config {
            background-color: var(--card);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .ip-config input {
            background: #0d1117;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            font-family: monospace;
            text-align: center;
        }

        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card h2 {
            font-size: 0.95rem;
            color: var(--text);
            display: flex;
            justify-content: space-between;
        }

        .card h2 span {
            color: var(--accent);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            height: 8px;
            border-radius: 4px;
            background: var(--border);
        }

        .joystick-container {
            width: 100%;
            height: 180px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 16px;
            position: relative;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-puck {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: var(--card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background: var(--accent);
            color: var(--background);
        }
    </style>
</head>
<body>

    <header>
        <h1>Desktop Dummy v1.0</h1>
        <p class="status">Heavy-Duty Robotic Arm which can hold 500 grams</p>
     </header>

     <div class="ip-config">
        <input type="text" id="espIp" placeholder="IP adresa ESP32 (např. 192.168.1.50)">
     </div>

     <div class="controls-grid">

        <!-- 2D Joystick pre Base + Shoulder -->
        <div class="card">
            <h2> Base (X) & Shoulder (Y)</h2>
            <div class="joystick-container" id="joystickZone">
                <div class="joystick-puck" id="puck"></div>   
            </div>
        </div>

        <!-- Slider pre Elbow (Z) -->
        <div class="card">
            <h2> Elbow / Height (Z) <span id="valZ">90˚</span></h2>
            <input type="range" id="sliderZ" min="0" max="180" value="90">
        </div>

        <!-- Slider pre Gripper -->
        <div class="card">
            <h2> Gripper / Can Grip <span id="valG">0˚</span></h2>
            <input type="range" id="sliderG" min="0" max="90" value="0">
        </div>

        <div class="btn-group">
            <button onclick="sendPreset(90, 90, 90, 0)">Home Position / Reset Button</button>
            <button onclick="sendPreset(90, 45, 120, 45)">Grip Position / Pick-Up</button>
        </div>

     </div>

     <script>
        const espIpInput = document.getElementById('espIp');
        const sliderZ = document.getElementById('sliderZ');
        const sliderG = document.getElementById('sliderG');
        const valZ = document.getElementById('valZ');
        const valG = document.getElementById('valG');

        sliderZ.oninput = (e) => { valZ.innerText = e.target.value + '˚'; sendCommand(); };
        sliderG.oninput = (e) => { valG.innerText = e.target.value + '˚'; sendCommand(); };

        const zone = document.getElementById('joystickZone');
        const puck = document.getElementById('puck');
        let active = false;
        let startX, startY;
        let posX = 90, posY = 90; //Initial positions for Base and Shoulder

        zone.addEventListener('pointerdown', (e) => {
            active = true;
            startX = e.clientX;
            startY = e.clientY;
            zone.setPointerCapture(e.pointerId);
        });

        zone.addEventListener('pointermove', (e) => {
            if (!active) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const maxDistance = 50; // Max distance for the joystick puck

            const dist = Math.min(Math.hypot(dx, dy), maxDistance);
            const angle = Math.atan2(dy, dx);

            const moveX = Math.cos(angle) * dist;
            const moveY = Math.sin(angle) * dist;

            puck.style.transform = `translate(${moveX}px, ${moveY}px)`;

            posX = Math.round(90 + (moveX / maxDistance) * 90);
            posY = Math.round(90 + (moveY / maxDistance) * 90);

            sendCommand();
          });

          const resetPuck = () => {
            if (!active) return;
            active = false;
            puck.style.transform = `translate(0px, 0px)`;
            posX = 90;
            posY = 90;
            sendCommand();
          };

          zone.addEventListener('pointerup', resetPuck);
          zone.addEventListener('pointercancel', resetPuck);

          let lastSend = 0;
          function sendCommand() {
            const now = Date.now();
            if (now - lastSend < 70) return; // ~14 FPS limit pro plynulý chod
            lastSend = now;

            const ip = espIpInput.value;
            if (!ip) return;

            const url = `http://${ip}/move?x=${posX}&y=${posY}&z=${sliderZ.value}&g=${sliderG.value}`;
            fetch(url, { mode: 'no-cors' }).catch(() => {});
          }

          function sendPreset(x, y, z, g) {
            posX = x; posY = y;
            sliderZ.value = z; valZ.innerText = z + '˚';
            sliderG.value = g; valG.innerText = g + '˚';
            sendCommand();
          }
     </script>
</body>
</html>
